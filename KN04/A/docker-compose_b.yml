version: '3.9'

services:
  db:
    image: jvl1an4/m347:kn02b-db
    container_name: m347-kn04b-db
    networks:
      custom-net:
        ipv4_address: 172.25.5.10

  web:
    image: jvl1an4/m347:kn02b-web
    container_name: m347-kn04b-web
    ports:
      - "8088:80"
    networks:
      custom-net:
        ipv4_address: 172.25.5.11

networks:
  custom-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
          ip_range: 172.25.5.0/24
          gateway: 172.25.5.254
